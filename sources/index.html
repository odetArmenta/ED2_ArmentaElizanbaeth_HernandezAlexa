<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AudioStream</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Archivo CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="text-center p-3">
        <h1>AudioStream</h1>
        <p>Mi reproductor de música</p>
    </header>

    <!-- Menú de navegación -->
    <nav class="text-center p-2">
        <a href="#reproductor">Reproductor</a>
        <a href="#canciones">Canciones</a>
    </nav>

    <!-- Contenido principal -->
    <main class="container">

        <div class="row">

            <!-- Sección del reproductor -->
            <section id="reproductor"
                class="col-12 col-sm-12 col-md-6 col-lg-6 p-3">

                <h2>Reproductor</h2>

                <article class="caja">

                    <!-- Imagen de la canción -->
                    <img
                        id="portada"
                        src="../src/olivia.png"
                        alt="Portada de la canción"
                        class="img-fluid portada"
                        width="250"
                        height="250">

                    <!-- Nombre de la canción -->
                    <h3 id="titulo">can't catch me now</h3>

                    <!-- Elemento de audio -->
                    <audio id="audio" preload="metadata"></audio>

                    <!-- Botones del reproductor -->
                    <button type="button" onclick="anterior()">
                        Anterior
                    </button>

                    <button type="button" onclick="reproducir()">
                        Play / Pausa
                    </button>

                    <button type="button" onclick="siguiente()">
                        Siguiente
                    </button>

                    <!-- Barra de progreso -->
                    <input
                        type="range"
                        id="progreso"
                        min="0"
                        max="100"
                        value="0"
                        aria-label="Progreso de la canción"
                        oninput="moverCancion()">

                </article>

            </section>

            <!-- Sección de canciones -->
            <section id="canciones"
                class="col-12 col-sm-12 col-md-6 col-lg-6 p-3">

                <h2>Mis canciones</h2>

                <article class="caja">

                    <!-- JavaScript mostrará las canciones -->
                    <ul id="lista"></ul>

                </article>

            </section>

        </div>

    </main>

    <!-- Pie de página -->
    <footer class="text-center p-3">

        <p>Proyecto AudioStream</p>

        <!-- Enlace a GitHub -->
        <a
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-dark">
            Ver proyecto en GitHub
        </a>

    </footer>

    <!-- Archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
